<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Sign in to your Netflix account." />
  <title>Netflix - Sign In</title>
  <link rel="stylesheet" href="../src/styles/main.css" />
  <link rel="stylesheet" href="../src/styles/components.css" />
  <link rel="stylesheet" href="../src/styles/auth.css" />
</head>
<body class="auth-page">

  <header class="auth-header">
    <a href="../index.html" class="logo">NETFLIX</a>
  </header>

  <main class="auth-container">
    <div class="auth-box">
      <h2>Sign In</h2>
      <form id="loginForm" class="auth-form" novalidate>
        <div class="form-group">
          <input 
            type="email" 
            id="loginEmail" 
            class="form-input" 
            placeholder="Email or phone number" 
            required 
            aria-label="Email or phone number"
          />
          <span class="error-hint">Please enter a valid email.</span>
        </div>

        <div class="form-group">
          <input 
            type="password" 
            id="loginPassword" 
            class="form-input" 
            placeholder="Password" 
            required 
            aria-label="Password"
          />
          <span class="error-hint">Password must be between 4 and 60 characters.</span>
        </div>

        <button type="submit" class="auth-btn">Sign In</button>
      </form>

      <p class="auth-footer-text">
        New to Netflix? <a href="signup.html">Sign up now</a>.
      </p>
    </div>
  </main>

  <script type="module" src="../src/pages/auth.js"></script>
</body>
</html>
