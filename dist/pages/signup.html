<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Sign up for Netflix." />
  <title>Netflix - Sign Up</title>
  <script type="module" crossorigin src="/assets/components-5WVH0zQ-.js"></script>
  <script type="module" crossorigin src="/assets/auth-BTF1MTK7.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/components-BXeGMT27.css">
  <link rel="stylesheet" crossorigin href="/assets/auth-_22LUzOS.css">
</head>
<body class="auth-page">

  <header class="auth-header">
    <a href="../index.html" class="logo">NETFLIX</a>
  </header>

  <main class="auth-container">
    <div class="auth-box">
      <h2>Create Account</h2>
      <form id="signupForm" class="auth-form" novalidate>
        <div class="form-group">
          <input 
            type="text" 
            id="signupName" 
            class="form-input" 
            placeholder="Full name" 
            required 
            aria-label="Full name"
          />
          <span class="error-hint">Please enter your name.</span>
        </div>

        <div class="form-group">
          <input 
            type="email" 
            id="signupEmail" 
            class="form-input" 
            placeholder="Email address" 
            required 
            aria-label="Email address"
          />
          <span class="error-hint">Please enter a valid email address.</span>
        </div>

        <div class="form-group">
          <input 
            type="password" 
            id="signupPassword" 
            class="form-input" 
            placeholder="Add a password" 
            required 
            aria-label="Add a password"
          />
          <span class="error-hint">Password must be at least 6 characters.</span>
        </div>

        <button type="submit" class="auth-btn">Sign Up</button>
      </form>

      <p class="auth-footer-text">
        Already have an account? <a href="login.html">Sign in now</a>.
      </p>
    </div>
  </main>

</body>
</html>
